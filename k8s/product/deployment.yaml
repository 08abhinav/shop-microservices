apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product-svc
          image: 08abhinav/product-svc:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: product-config
            - secretRef:
                name: product-secret