apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 08abhinav/gateway-svc:latest
          ports:
            - containerPort: 8080
            - containerPort: 9876
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret