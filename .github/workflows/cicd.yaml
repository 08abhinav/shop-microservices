name: ci/cd

on:
  push:
    branches: ["master"]
    paths-ignore:
      - '**.md'            
      - 'docs/**'       
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: 08abhinav
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality-check:
    name: "Quality Check: ${{ matrix.service.name }}"
    runs-on: self-hosted
    strategy:
      matrix:
        service:
          - name: "userSvc"
            dir: "./userSvc"
            node-version: "22"
          - name: "productSvc"
            dir: "./productSvc"
            node-version: "20"
          - name: "gatewaySvc"
            dir: "./my-gateway"
            node-version: "20"
    defaults:
      run:
        working-directory: ${{ matrix.service.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.service.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service.dir }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  security:
    name: "GitLeaks Secret Scan"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitLeaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-scan-push:
    name: "Build, Scan and Push Image"
    runs-on: self-hosted
    needs: [quality-check, security]
    strategy:
      matrix:
        service:
          - image_name: "user-svc"
            context: "./userSvc"
          - image_name: "product-svc"
            context: "./productSvc"
          - image_name: "gateway-svc"
            context: "./my-gateway"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:latest \
            ${{ matrix.service.context }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:latest
