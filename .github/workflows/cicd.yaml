name: ci/cd

on:
  push:
    branches: ["master"]
    paths-ignore:
      - '**.md'            
      - 'docs/**'       
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: 08abhinav
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality-check:
    name: "Quality Check: ${{ matrix.service.name }}"
    runs-on: self-hosted
    strategy:
      matrix:
        service:
          - name: "userSvc"
            dir: "./userSvc"
            node-version: "22"
          - name: "productSvc"
            dir: "./productSvc"
            node-version: "22"
          - name: "gatewaySvc"
            dir: "./my-gateway"
            node-version: "22"
    defaults:
      run:
        working-directory: ${{ matrix.service.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.service.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service.dir }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  security:
    name: "GitLeaks Secret Scan"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-scan-push:
    name: "Build, Scan and Push Image"
    runs-on: self-hosted
    needs: [quality-check, security]
    strategy:
      matrix:
        service:
          - image_name: "user-svc"
            context: "./userSvc"
          - image_name: "product-svc"
            context: "./productSvc"
          - image_name: "gateway-svc"
            context: "./my-gateway"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:latest \
            ${{ matrix.service.context }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ matrix.service.image_name }}:latest

  deploy:
    name: "deploy-to-minikube"
    runs-on: self-hosted
    needs: build-scan-push
    steps:
      - uses: actions/checkout@v4

      - name: Verify minikube running
        run: |
          minikube status
          kubectl config use-context minikube

      - name: Enable Nginx ingress
        run: |
          minikube addons enable ingress

      - name: wait for ingress controller
        run: |
          kubectl wait \
          --namespace ingress-nginx \
          --for=condition=Ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s
          
      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Deploy user-db secret
        run: |
          sed \
            -e "s|MONGO_INITDB_ROOT_USERNAME: \"\"|MONGO_INITDB_ROOT_USERNAME: \"${{ secrets.DB_USERNAME }}\"|" \
            -e "s|MONGO_INITDB_ROOT_PASSWORD: \"\"|MONGO_INITDB_ROOT_PASSWORD: \"${{ secrets.DB_PASSWORD }}\"|" \
            k8s/userdb/secret.yaml | kubectl apply -f -
            
      - name: Deploy user-db
        run: |
          kubectl apply -f k8s/userdb/config.yaml
          kubectl apply -f k8s/userdb/service.yaml
          kubectl apply -f k8s/userdb/storageclass.yaml
          kubectl apply -f k8s/userdb/statefulset.yaml

      - name: Wait for user-db
        run: |
          kubectl rollout status statefulset/user-db -n dev --timeout=300s
            
      - name: Deploy user secret
        run: |
           sed \
            -e "s|MONGODB_URI: \"\"|MONGODB_URI: \"${{ secrets.USER_DB_URI }}\"|" \
            -e "s|JWT_SECRET: \"\"|JWT_SECRET: \"${{ secrets.JWT_SECRET }}\"|" \
            k8s/user/secret.yaml | kubectl apply -f -
            
      - name: Deploy user
        run: |
          kubectl apply -f k8s/user/config.yaml
          kubectl apply -f k8s/user/service.yaml
          kubectl apply -f k8s/user/deployment.yaml
            
      - name: Deploy product-db secret
        run: |
            sed \
              -e "s|MONGO_INITDB_ROOT_USERNAME: \"\"|MONGO_INITDB_ROOT_USERNAME: \"${{ secrets.DB_USERNAME }}\"|" \
              -e "s|MONGO_INITDB_ROOT_PASSWORD: \"\"|MONGO_INITDB_ROOT_PASSWORD: \"${{ secrets.DB_PASSWORD }}\"|" \
              k8s/productdb/secret.yaml | kubectl apply -f -
              
      - name: Deploy product-db
        run: |
          kubectl apply -f k8s/productdb/config.yaml
          kubectl apply -f k8s/productdb/service.yaml
          kubectl apply -f k8s/productdb/storageclass.yaml
          kubectl apply -f k8s/productdb/statefulset.yaml

      - name: Wait for product-db
        run: |
          kubectl rollout status statefulset/product-db -n dev --timeout=300s
      
      - name: Deploy product secret
        run: |
           sed \
            -e "s|MONGODB_URI: \"\"|MONGODB_URI: \"${{ secrets.PRODUCT_DB_URI }}\"|" \
            k8s/product/secret.yaml | kubectl apply -f -
            
      - name: Deploy product
        run: |
          kubectl apply -f k8s/product/config.yaml
          kubectl apply -f k8s/product/service.yaml
          kubectl apply -f k8s/product/deployment.yaml

      - name: Deploy gateway secret
        run: |
           sed \
            -e "s|JWT_SECRET: \"\"|JWT_SECRET: \"${{ secrets.JWT_SECRET }}\"|" \
            k8s/gateway/secret.yaml | kubectl apply -f -

      - name: Deploy gateway
        run: |
          kubectl apply -f k8s/gateway/config.yaml
          kubectl apply -f k8s/gateway/service.yaml
          kubectl apply -f k8s/gateway/deployment.yaml


      - name: deploy ingress
        run: |
         kubectl apply -f k8s/ingress.yaml          
