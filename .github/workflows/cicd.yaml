name: ci/cd

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: 08abhinav
  IMAGE_TAG: ${{ github.sha }}

jobs:
  userSvc-build:
    name: "code quality check"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./userSvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./userSvc/package-lock.json
          
      - name: install dependencies
        run : npm ci

      - name: Run tests
        run: npm test --if-present
        
  productSvc-build:
    name: "code quality check"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./userSvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./userSvc/package-lock.json
          
      - name: install dependencies
        run : npm ci
        
      - name: Run tests
        run: npm test --if-present
        
  security:
    name: "security scan"
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: git leak scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-scan-push:
    name: "Build, Scan and Push All Services"
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Build user-svc
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/user-svc:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/user-svc:latest \
            ./userSvc
            
      - name: Build product-svc
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/product-svc:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/product-svc:latest \
            ./productSvc
            
      - name: Scan user-svc image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/user-svc:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan product-svc image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/product-svc:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push user-svc and product-svc
        run: |
          docker push ${{ env.REGISTRY }}/user-svc:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/user-svc:latest

          docker push ${{ env.REGISTRY }}/product-svc:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/product-svc:latest
